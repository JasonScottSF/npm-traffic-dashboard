# Dedicated WAF test endpoint for the waf-tester service.
# When waf-tester requests http://npm_waf:8080 it sends Host: npm_waf:8080
# (nginx strips the port for server_name matching → matches "npm_waf").
# Traffic path: waf-tester → WAF (ModSecurity) → breach-detector → frontend
server {
    listen 8080;
    server_name npm_waf;

    location / {
        proxy_pass http://breach-detector:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 0;
    }
}
