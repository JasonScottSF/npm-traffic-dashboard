[Definition]
# Matches known scanners, exploit tools, and aggressive scrapers in NPM access logs.
# UA appears in the final quoted field after [Client <HOST>].
failregex = ^\[.*\] - \d+ \d+ - \S+ \S+ \S+ ".*" \[Client <HOST>\] .* "(?:masscan|nikto|nmap|sqlmap|zgrab|nuclei|dirbuster|gobuster|ffuf|wfuzz|hydra|medusa|burp|acunetix|nessus|openvas|AhrefsBot|MJ12bot|DotBot|SemrushBot|BLEXBot|MajesticSEO|Bytespider|GPTBot|CCBot|PetalBot|DataForSeoBot|SiteAuditBot|python-requests|Go-http-client/1\.1|Scrapy|curl/)[^"]*"
ignoreregex =
