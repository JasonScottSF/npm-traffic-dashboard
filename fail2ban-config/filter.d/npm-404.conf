[Definition]
failregex = ^\[.*\] - 404 \d+ - \S+ \S+ \S+ ".*" \[Client <HOST>\]
# Never count Let's Encrypt ACME HTTP-01 challenge requests toward the 404 ban.
# LE validates from multiple vantage-point IPs simultaneously; if the challenge
# path isn't served yet and those requests return 404, the IPs would hit the
# ban threshold and be blocked at the iptables level before NPM can serve the
# challenge on a retry — causing cert issuance/renewal to fail permanently.
ignoreregex = ^\[.*\] - 404 \d+ - \S+ \S+ \S+ ".*\.well-known/acme-challenge.*" \[Client <HOST>\]
