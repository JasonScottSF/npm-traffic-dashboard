services:
  # ── Nginx Proxy Manager ────────────────────────────────────────────────────
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy_manager
    ports:
      - "80:80"
      - "443:443"
      - "81:81"   # NPM admin UI — firewall this to trusted IPs
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - dashboard_net
    restart: unless-stopped

  # ── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: npm_dashboard_db
    environment:
      POSTGRES_DB: npm_dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - dashboard_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d npm_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Log parser ─────────────────────────────────────────────────────────────
  parser:
    build: ./parser
    container_name: npm_log_parser
    environment:
      DATABASE_URL: postgresql://dashboard:${DB_PASSWORD:-changeme}@db:5432/npm_dashboard
      LOG_DIR: /npm_data/logs
      GEOIP_DB: /geoip/GeoLite2-Country.mmdb
      PYTHONUNBUFFERED: "1"
    volumes:
      - npm_data:/npm_data:ro
      - geoip_data:/geoip
    networks:
      - dashboard_net
    depends_on:
      db:
        condition: service_healthy
      npm:
        condition: service_started
    restart: unless-stopped

  geoip_updater:
    build: ./parser
    container_name: npm_geoip_updater
    command: python geoip_updater.py
    environment:
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      GEOIP_DB: /geoip/GeoLite2-Country.mmdb
      GEOIP_DAEMON: "true"
      GEOIP_INTERVAL_HOURS: "24"
      PYTHONUNBUFFERED: "1"
    volumes:
      - geoip_data:/geoip
    networks:
      - dashboard_net
    restart: unless-stopped

  # ── Dashboard API ──────────────────────────────────────────────────────────
  api:
    build: ./api
    container_name: npm_dashboard_api
    environment:
      DATABASE_URL: postgresql://dashboard:${DB_PASSWORD:-changeme}@db:5432/npm_dashboard
    networks:
      - dashboard_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Auth service ───────────────────────────────────────────────────────────
  auth:
    build: ./auth
    container_name: npm_auth
    environment:
      PYTHONUNBUFFERED: "1"
      APP_NAME: ${APP_NAME:-NPM Dashboard}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - auth_data:/auth_data
    networks:
      - dashboard_net
    restart: unless-stopped

  # ── Fail2ban daemon ────────────────────────────────────────────────────────
  fail2ban-server:
    image: crazymax/fail2ban:latest
    container_name: npm_fail2ban_server
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: ${TZ:-UTC}
      F2B_LOG_TARGET: /data/fail2ban.log
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 30d
    volumes:
      - fail2ban_data:/data
      - fail2ban_socket:/var/run/fail2ban
      - fail2ban_jaild:/etc/fail2ban/jail.d
      - ./fail2ban-config/jail.local:/etc/fail2ban/jail.local:ro
      - ./fail2ban-config/defaults-debian.conf:/etc/fail2ban/jail.d/defaults-debian.conf:ro
      - ./fail2ban-config/filter.d/npm-http-auth.conf:/etc/fail2ban/filter.d/npm-http-auth.conf:ro
      - ./fail2ban-config/filter.d/npm-badbots.conf:/etc/fail2ban/filter.d/npm-badbots.conf:ro
      - ./fail2ban-config/filter.d/geoblock.conf:/etc/fail2ban/filter.d/geoblock.conf:ro
      - ./fail2ban-config/filter.d/auth-login.conf:/etc/fail2ban/filter.d/auth-login.conf:ro
      - ./fail2ban-config/filter.d/npm-404.conf:/etc/fail2ban/filter.d/npm-404.conf:ro
      - npm_data:/npm_data:ro
      - /var/log:/host-logs:ro
      - auth_data:/auth_data:ro
    restart: unless-stopped

  # ── Fail2ban API ───────────────────────────────────────────────────────────
  fail2ban:
    build: ./fail2ban
    container_name: npm_fail2ban_api
    environment:
      PYTHONUNBUFFERED: "1"
      F2B_LOG: /f2b_data/fail2ban.log
      GEOIP_DB: /geoip/GeoLite2-Country.mmdb
    volumes:
      - fail2ban_socket:/var/run/fail2ban
      - fail2ban_data:/f2b_data:ro
      - fail2ban_jaild:/etc/fail2ban/jail.d
      - geoip_data:/geoip:ro
    networks:
      - dashboard_net
    depends_on:
      - fail2ban-server
    restart: unless-stopped

  # ── System monitor ─────────────────────────────────────────────────────────
  sysmon:
    build: ./sysmon
    container_name: npm_sysmon_api
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    networks:
      - dashboard_net
    restart: unless-stopped

  # ── Dashboard frontend ─────────────────────────────────────────────────────
  # Proxy to this from NPM: http://npm_dashboard_frontend:80
  # Direct access (bypass NPM) on DASHBOARD_PORT if set.
  frontend:
    build: ./frontend
    container_name: npm_dashboard_frontend
    ports:
      - "${DASHBOARD_PORT:-8090}:80"
    networks:
      - dashboard_net
    depends_on:
      - api
      - auth
    restart: unless-stopped

networks:
  dashboard_net:
    driver: bridge

volumes:
  npm_data:
  npm_letsencrypt:
  db_data:
  geoip_data:
  fail2ban_data:
  fail2ban_socket:
  fail2ban_jaild:
  auth_data:
