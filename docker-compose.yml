services:
  # ── Nginx Proxy Manager ────────────────────────────────────────────────────
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy_manager
    ports:
      - "80:80"
      - "443:443"
      - "81:81"   # NPM admin UI — firewall this to trusted IPs
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - dashboard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sfL http://localhost:81/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Backup ─────────────────────────────────────────────────────────────────
  backup:
    build: ./backup
    container_name: npm_backup
    environment:
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-3600}
    volumes:
      - npm_data:/volumes/npm_data:ro
      - auth_data:/volumes/auth_data:ro
      - fail2ban_data:/volumes/fail2ban_data:ro
      - backup_trigger:/trigger
    secrets:
      - db_password
      - backup_github_token
    networks:
      - dashboard_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-d", "/repo/.git"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: npm_dashboard_db
    environment:
      POSTGRES_DB: npm_dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - dashboard_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d npm_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Log parser ─────────────────────────────────────────────────────────────
  parser:
    build: ./parser
    container_name: npm_log_parser
    environment:
      DATABASE_URL: postgresql://dashboard@db:5432/npm_dashboard
      TZ: ${TZ:-UTC}
      LOG_DIR: /npm_data/logs
      GEOIP_DB: /geoip/GeoLite2-Country.mmdb
      STATE_FILE: /parser_state/positions.json
      DLQ_FILE: /parser_state/dlq.jsonl
      STATE_RETENTION_DAYS: ${STATE_RETENTION_DAYS:-90}
      PYTHONUNBUFFERED: "1"
    volumes:
      - npm_data:/npm_data:ro
      - geoip_data:/geoip:ro
      - parser_state:/parser_state
    secrets:
      - db_password
    networks:
      - dashboard_net
    depends_on:
      db:
        condition: service_healthy
      npm:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,time,sys; f='/tmp/health'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f)<90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  geoip_updater:
    build: ./parser
    container_name: npm_geoip_updater
    command: python geoip_updater.py
    environment:
      GEOIP_DB: /geoip/GeoLite2-Country.mmdb
      GEOIP_DAEMON: "true"
      GEOIP_INTERVAL_HOURS: "24"
      PYTHONUNBUFFERED: "1"
    volumes:
      - geoip_data:/geoip
    secrets:
      - maxmind_license_key
    networks:
      - dashboard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys; sys.exit(0 if os.path.exists('/geoip/GeoLite2-Country.mmdb') else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Dashboard API ──────────────────────────────────────────────────────────
  api:
    build: ./api
    container_name: npm_dashboard_api
    environment:
      DATABASE_URL: postgresql://dashboard@db:5432/npm_dashboard
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
    volumes:
      - backup_trigger:/trigger
    secrets:
      - db_password
      - abuseipdb_key
    networks:
      - dashboard_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Auth service ───────────────────────────────────────────────────────────
  auth:
    build: ./auth
    container_name: npm_auth
    environment:
      PYTHONUNBUFFERED: "1"
      APP_NAME: ${APP_NAME:-NPM Dashboard}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      RESET_EXP: ${RESET_EXP:-3600}
      TOKEN_EXP: ${TOKEN_EXP:-28800}
      INVITE_EXP: ${INVITE_EXP:-172800}
    volumes:
      - auth_data:/auth_data
    secrets:
      - smtp_user
      - smtp_password
    networks:
      - dashboard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Fail2ban daemon ────────────────────────────────────────────────────────
  fail2ban-server:
    image: crazymax/fail2ban:latest
    container_name: npm_fail2ban_server
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: ${TZ:-UTC}
      F2B_LOG_TARGET: /data/fail2ban.log
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 30d
      WHITELIST_CIDRS: ${WHITELIST_CIDRS:-}
    volumes:
      - fail2ban_data:/data
      - fail2ban_socket:/var/run/fail2ban
      - fail2ban_jaild:/etc/fail2ban/jail.d
      - ./fail2ban-config/jail.local:/etc/fail2ban/jail.local:ro
      - ./fail2ban-config/defaults-debian.conf:/etc/fail2ban/jail.d/defaults-debian.conf:ro
      - ./fail2ban-config/filter.d/npm-http-auth.conf:/etc/fail2ban/filter.d/npm-http-auth.conf:ro
      - ./fail2ban-config/filter.d/npm-badbots.conf:/etc/fail2ban/filter.d/npm-badbots.conf:ro
      - ./fail2ban-config/filter.d/geoblock.conf:/etc/fail2ban/filter.d/geoblock.conf:ro
      - ./fail2ban-config/filter.d/auth-login.conf:/etc/fail2ban/filter.d/auth-login.conf:ro
      - ./fail2ban-config/filter.d/npm-404.conf:/etc/fail2ban/filter.d/npm-404.conf:ro
      - ./fail2ban-config/cont-init.d/10-whitelist.sh:/etc/cont-init.d/10-whitelist.sh:ro
      - npm_data:/npm_data:ro
      - /var/log:/host-logs:ro
      - auth_data:/auth_data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "fail2ban-client", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Fail2ban API ───────────────────────────────────────────────────────────
  fail2ban:
    build: ./fail2ban
    container_name: npm_fail2ban_api
    environment:
      PYTHONUNBUFFERED: "1"
      F2B_LOG: /f2b_data/fail2ban.log
      GEOIP_DB: /geoip/GeoLite2-Country.mmdb
      GEO_REFRESH_DAYS: ${GEO_REFRESH_DAYS:-7}
    volumes:
      - fail2ban_socket:/var/run/fail2ban
      - fail2ban_data:/f2b_data:ro
      - fail2ban_jaild:/etc/fail2ban/jail.d
      - geoip_data:/geoip:ro
    networks:
      - dashboard_net
    depends_on:
      - fail2ban-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── System monitor ─────────────────────────────────────────────────────────
  sysmon:
    build: ./sysmon
    container_name: npm_sysmon_api
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    pid: host
    networks:
      - dashboard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Landing page ──────────────────────────────────────────────────────────
  landing:
    build: ./landing
    container_name: npm_landing
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-UTC}
      NPM_API_URL: ${NPM_API_URL:-http://nginx_proxy_manager:81}
      NPM_API_EMAIL: ${NPM_API_EMAIL:-}
      NPM_API_PASSWORD: ${NPM_API_PASSWORD:-}
      SYNC_INTERVAL: ${LANDING_SYNC_INTERVAL:-60}
    ports:
      - "${LANDING_PORT:-8091}:8008"
    volumes:
      - landing_data:/landing_data
    networks:
      - dashboard_net
    depends_on:
      - npm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Alerts service ─────────────────────────────────────────────────────────
  alerts:
    build: ./alerts
    container_name: npm_alerts
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-UTC}
      DATABASE_URL: postgresql://dashboard@db:5432/npm_dashboard
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
    secrets:
      - db_password
      - smtp_user
      - smtp_password
    networks:
      - dashboard_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Breach Detector ────────────────────────────────────────────────────────
  # Transparent proxy behind the WAF — inspects traffic for WAF bypasses.
  # Traffic path:  WAF → breach-detector:8090 → frontend:80
  breach-detector:
    build: ./breach-detector
    container_name: npm_breach_detector
    environment:
      UPSTREAM_URL: http://npm_dashboard_frontend:80
      PORT: "8090"
      PYTHONUNBUFFERED: "1"
    networks:
      - dashboard_net
    depends_on:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/breach/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── WAF Tester ─────────────────────────────────────────────────────────────
  waf-tester:
    build: ./waf-tester
    container_name: npm_waf_tester
    environment:
      WAF_URL: http://npm_waf:8080
      BREACH_URL: http://breach-detector:8090
      PYTHONUNBUFFERED: "1"
    networks:
      - dashboard_net
    depends_on:
      - waf
      - breach-detector
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── WAF (OWASP ModSecurity CRS) ────────────────────────────────────────────
  # Traffic path: NPM → npm_waf:8080 → per-host backend (managed by waf-config-gen)
  # waf-config-gen auto-redirects all NPM proxy hosts through this container
  # and writes per-host nginx server blocks to the shared waf_conf volume.
  # modsecurity is ON globally (conf.d/modsecurity.conf) — all traffic inspected.
  waf:
    build: ./waf
    container_name: npm_waf
    environment:
      BACKEND: http://breach-detector:8090   # fallback only — real routing in waf_conf
      PORT: "8080"
      MODSEC_RULE_ENGINE: ${WAF_MODE:-DetectionOnly}
      MODSEC_AUDIT_ENGINE: "On"
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit/audit.log
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG_PARTS: ABCFHIJKZ
      WHITELIST_CIDRS: ${WHITELIST_CIDRS:-}
      REAL_IP_HEADER: X-Real-IP
      NGINX_SET_REAL_IP_FROM: 172.16.0.0/12
      REAL_IP_RECURSIVE: "on"
      PARANOIA: "2"
    volumes:
      - waf_logs:/var/log/modsecurity
      - ./waf-config/REQUEST-999-CUSTOM.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-999-CUSTOM.conf:ro
      - ./waf/health.conf:/etc/nginx/conf.d/health.conf:ro
      - ./waf/test.conf:/etc/nginx/conf.d/test.conf:ro
      - waf_conf:/etc/nginx/conf.d/dynamic   # dynamic per-host configs from waf-config-gen
    networks:
      - dashboard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── WAF Config Generator ───────────────────────────────────────────────────
  # Polls NPM API, saves backend mappings, auto-redirects all proxy hosts
  # through the WAF, and generates per-host nginx configs. Reloads WAF nginx
  # automatically whenever the config changes.
  waf-config-gen:
    build: ./waf-config-gen
    container_name: npm_waf_config_gen
    environment:
      PYTHONUNBUFFERED: "1"
      NPM_API_URL: ${NPM_API_URL:-http://nginx_proxy_manager:81}
      NPM_API_EMAIL: ${NPM_API_EMAIL:-}
      NPM_API_PASSWORD: ${NPM_API_PASSWORD:-}
      WAF_AUTO_REDIRECT: ${WAF_AUTO_REDIRECT:-true}
      WAF_STATIC_BACKENDS: ${WAF_STATIC_BACKENDS:-}
      WAF_CONTAINER: npm_waf
      WAF_PORT: "8080"
      SYNC_INTERVAL: ${WAF_SYNC_INTERVAL:-30}
    volumes:
      - waf_conf:/waf_conf
      - waf_config_data:/config_data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dashboard_net
    depends_on:
      - waf
      - npm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "from pathlib import Path; exit(0 if Path('/waf_conf/proxy_hosts.conf').exists() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── WAF audit log rotator ──────────────────────────────────────────────────
  log-rotator:
    build: ./log-rotator
    container_name: npm_log_rotator
    volumes:
      - waf_logs:/waf_logs
    networks:
      - dashboard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/waf_logs/logrotate.state"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── WAF API ────────────────────────────────────────────────────────────────
  waf-api:
    build: ./waf-api
    container_name: npm_waf_api
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-UTC}
      WAF_AUDIT_LOG: /waf_logs/audit/audit.log
      WAF_DLQ: /waf_logs/audit/dlq.jsonl
      WAF_MODE: ${WAF_MODE:-DetectionOnly}
      GEOIP_DB: /geoip/GeoLite2-Country.mmdb
    volumes:
      - waf_logs:/waf_logs:ro
      - geoip_data:/geoip:ro
    networks:
      - dashboard_net
    depends_on:
      - waf
      - breach-detector
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Dashboard frontend ─────────────────────────────────────────────────────
  # In NPM, proxy to: http://npm_waf:8080   (traffic goes through WAF)
  # For direct LAN access (bypasses WAF): http://<host>:DASHBOARD_PORT
  frontend:
    build: ./frontend
    container_name: npm_dashboard_frontend
    ports:
      - "${DASHBOARD_PORT:-8090}:80"
    networks:
      - dashboard_net
    depends_on:
      - api
      - auth
      - alerts
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dashboard_net:
    driver: bridge

volumes:
  npm_data:
  npm_letsencrypt:
  db_data:
  geoip_data:
  fail2ban_data:
  fail2ban_socket:
  fail2ban_jaild:
  auth_data:
  waf_logs:
  waf_conf:
  waf_config_data:
  parser_state:
  landing_data:
  backup_trigger:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  backup_github_token:
    file: ./secrets/backup_github_token.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  smtp_user:
    file: ./secrets/smtp_user.txt
  abuseipdb_key:
    file: ./secrets/abuseipdb_key.txt
  maxmind_license_key:
    file: ./secrets/maxmind_license_key.txt
