services:
  db:
    image: postgres:16-alpine
    container_name: npm_dashboard_db
    environment:
      POSTGRES_DB: npm_dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - dashboard_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d npm_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  parser:
    build: ./parser
    container_name: npm_log_parser
    environment:
      DATABASE_URL: postgresql://dashboard:${DB_PASSWORD:-changeme}@db:5432/npm_dashboard
      LOG_DIR: /npm_logs
      GEOIP_DB: /geoip/GeoLite2-Country.mmdb
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${NPM_LOG_PATH:-/opt/npm/data/logs}:/npm_logs:ro
      - geoip_data:/geoip
    networks:
      - dashboard_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  geoip_updater:
    build: ./parser
    container_name: npm_geoip_updater
    command: python geoip_updater.py
    environment:
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      GEOIP_DB: /geoip/GeoLite2-Country.mmdb
    volumes:
      - geoip_data:/geoip
    networks:
      - dashboard_net
    restart: "no"

  api:
    build: ./api
    container_name: npm_dashboard_api
    environment:
      DATABASE_URL: postgresql://dashboard:${DB_PASSWORD:-changeme}@db:5432/npm_dashboard
    networks:
      - dashboard_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # fail2ban daemon — runs with host network + iptables capabilities
  # Shares socket with fail2ban-api via named volume
  fail2ban-server:
    image: crazymax/fail2ban:latest
    container_name: npm_fail2ban_server
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: ${TZ:-UTC}
      F2B_LOG_TARGET: /data/fail2ban.log
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 30d
    volumes:
      - fail2ban_data:/data
      - fail2ban_socket:/var/run/fail2ban
      - fail2ban_jaild:/etc/fail2ban/jail.d
      - ./fail2ban-config/jail.local:/etc/fail2ban/jail.local:ro
      - ./fail2ban-config/filter.d/npm-http-auth.conf:/etc/fail2ban/filter.d/npm-http-auth.conf:ro
      - ./fail2ban-config/filter.d/npm-badbots.conf:/etc/fail2ban/filter.d/npm-badbots.conf:ro
      - ${NPM_LOG_PATH:-/opt/npm/data/logs}:/npm_logs:ro
      - /var/log:/host-logs:ro
    restart: unless-stopped

  # fail2ban REST API — connects to daemon via shared socket volume
  fail2ban:
    build: ./fail2ban
    container_name: npm_fail2ban_api
    environment:
      PYTHONUNBUFFERED: "1"
      F2B_LOG: /f2b_data/fail2ban.log
    volumes:
      - fail2ban_socket:/var/run/fail2ban
      - fail2ban_data:/f2b_data:ro
      - fail2ban_jaild:/etc/fail2ban/jail.d
    networks:
      - dashboard_net
    depends_on:
      - fail2ban-server
    restart: unless-stopped

  sysmon:
    build: ./sysmon
    container_name: npm_sysmon_api
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    networks:
      - dashboard_net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: npm_dashboard_frontend
    ports:
      - "${DASHBOARD_PORT:-8090}:80"
    networks:
      - dashboard_net
    depends_on:
      - api
    restart: unless-stopped

networks:
  dashboard_net:
    driver: bridge

volumes:
  db_data:
  geoip_data:
  fail2ban_data:
  fail2ban_socket:
  fail2ban_jaild:
