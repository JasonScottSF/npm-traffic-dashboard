# REQUEST-999-CUSTOM.conf — site-specific ModSecurity rules
# Mounted at /etc/modsecurity.d/owasp-crs/rules/REQUEST-999-CUSTOM.conf
# Loaded by the CRS wildcard:  Include .../owasp-crs/rules/*.conf
# Processed after all stock CRS rules (999 sorts last).

# ── Backtick shell execution operator ────────────────────────────────────────
# CRS PL1+PL2 covers many RCE patterns but the backtick operator (`) is not
# explicitly matched by any stock rule. Applies after full URL + HTML decoding
# so the %60-encoded form is also caught.
SecRule ARGS "@rx `" \
    "id:9000001,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,\
    msg:'Custom: Backtick shell execution operator in ARGS',\
    tag:'attack-rce',\
    severity:'CRITICAL'"

# ── Outbound Data Leak false-positive suppression ─────────────────────────────
# CRS rule 953130 fires on API JSON responses that contain IP-address strings
# (e.g. /api/top_ips, /api/hosts, /api/summary).  The response body is scanned
# at phase:4; we disable that target for all /api/ paths at phase:1 so the rule
# never matches legitimate JSON payloads.
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:9001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=953130;RESPONSE_BODY"
