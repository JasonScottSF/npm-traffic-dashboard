# 99-local.conf — WAF audit log overrides for NPM Dashboard visibility
# Mounted at /etc/modsecurity.d/99-local.conf inside the WAF container.
# Directives here are processed after setup.conf so they take precedence.

# Write a JSON audit log to the shared volume so waf-api can read it.
SecAuditEngine On
SecAuditLog /var/log/modsecurity/audit/audit.log
SecAuditLogFormat JSON
SecAuditLogType Serial

# Parts: A=header B=request-headers C=request-body F=response-headers
#        H=trailer I=compact-body J=upload-info K=matched-rules Z=boundary
SecAuditLogParts ABCFHIJKZ
