# 99-local.conf — WAF local overrides for NPM Dashboard
# Mounted at /etc/modsecurity.d/99-local.conf inside the WAF container.
# Directives here are processed after setup.conf so they take precedence.

# ── Audit logging ─────────────────────────────────────────────────────────────
# Write a JSON audit log to the shared volume so waf-api can read it.
SecAuditEngine On
SecAuditLog /var/log/modsecurity/audit/audit.log
SecAuditLogFormat JSON
SecAuditLogType Serial

# Parts: A=header B=request-headers C=request-body F=response-headers
#        H=trailer I=compact-body J=upload-file K=matched-rules Z=boundary
SecAuditLogParts ABCFHIJKZ

# ── Custom rules ──────────────────────────────────────────────────────────────

# Backtick shell execution operator in request arguments.
# CRS PL1+PL2 covers many RCE patterns but the backtick operator (`) is not
# explicitly matched. This rule applies after URL-decoding so encoded variants
# (%60) are also caught.
SecRule ARGS "@rx `" \
    "id:9000001,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,\
    msg:'Custom rule: Backtick shell execution operator in ARGS',\
    tag:'attack-rce',\
    severity:'CRITICAL'"
