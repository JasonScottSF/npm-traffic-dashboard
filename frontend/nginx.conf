limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:20m   rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Health check (no auth required) ──────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Auth service (bypass auth_request — it IS the auth) ──────────────────
    location = /auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://auth:8003/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;
    }

    location = /auth/forgot {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://auth:8003/auth/forgot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;
    }

    location /auth/ {
        proxy_pass http://auth:8003/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;
    }

    # ── Internal auth sub-request (nginx auth_request target) ────────────────
    location = /internal/auth {
        internal;
        proxy_pass http://auth:8003/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # ── Login redirect for unauthenticated requests ───────────────────────────
    location @login_redirect {
        return 302 /auth/login;
    }

    # ── Protected API routes ──────────────────────────────────────────────────
    location /api/waf/ {
        limit_req zone=api_limit burst=30 nodelay;
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://waf-api:8004/api/waf/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/waf-test/ {
        limit_req zone=api_limit burst=30 nodelay;
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://waf-tester:8005/api/waf-test/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/breach/ {
        limit_req zone=api_limit burst=30 nodelay;
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://breach-detector:8090/api/breach/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/f2b/ {
        limit_req zone=api_limit burst=30 nodelay;
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://fail2ban:8001/api/f2b/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/sys/ {
        limit_req zone=api_limit burst=30 nodelay;
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://sysmon:8002/api/sys/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/alerts/ {
        limit_req zone=api_limit burst=30 nodelay;
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://alerts:8006/api/alerts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/landing/ {
        limit_req zone=api_limit burst=30 nodelay;
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://landing:8008/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Protected frontend ────────────────────────────────────────────────────
    location / {
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        try_files $uri $uri/ /index.html;
    }
}
