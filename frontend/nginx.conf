limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Auth service (bypass auth_request — it IS the auth) ──────────────────
    location = /auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://auth:8003/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;
    }

    location /auth/ {
        proxy_pass http://auth:8003/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;
    }

    # ── Internal auth sub-request (nginx auth_request target) ────────────────
    location = /internal/auth {
        internal;
        proxy_pass http://auth:8003/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # ── Login redirect for unauthenticated requests ───────────────────────────
    location @login_redirect {
        return 302 /auth/login;
    }

    # ── Protected API routes ──────────────────────────────────────────────────
    location /api/f2b/ {
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://fail2ban:8001/api/f2b/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/sys/ {
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://sysmon:8002/api/sys/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Protected frontend ────────────────────────────────────────────────────
    location / {
        auth_request /internal/auth;
        error_page 401 = @login_redirect;
        try_files $uri $uri/ /index.html;
    }
}
