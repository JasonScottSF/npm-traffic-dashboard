<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }} — Invalid Invite</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0c14;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #141722;
      border: 1px solid #1f2333;
      border-radius: 14px;
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      text-align: center;
    }
    .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
    p { color: #6b7280; font-size: 0.85rem; line-height: 1.6; margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      color: #818cf8;
      font-size: 0.85rem;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔗</div>
    <h1>Invite link invalid or expired</h1>
    <p>This invite link has already been used, has expired, or doesn't exist.<br>Ask an admin to generate a new one.</p>
    <a href="/auth/login">← Back to sign in</a>
  </div>
</body>
</html>
