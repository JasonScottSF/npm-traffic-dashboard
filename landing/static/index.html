<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jasonscott.us</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ccc;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 3rem 2rem 4rem;
    }

    header {
      max-width: 960px;
      margin: 0 auto 2rem;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .sub {
      margin-top: .3rem;
      font-size: .78rem;
      color: rgba(255,255,255,.6);
    }

    #grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: .65rem;
    }

    a.card {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      aspect-ratio: 1 / 1;
      background: #fff;
      border: none;
      border-radius: 12px;
      padding: 1rem;
      text-decoration: none;
      color: inherit;
      box-shadow:
        0 2px 4px rgba(0,0,0,.10),
        0 6px 14px rgba(0,0,0,.12),
        0 16px 32px rgba(0,0,0,.08);
      transition: box-shadow .2s, transform .2s;
    }

    a.card:hover {
      box-shadow:
        0 4px 8px rgba(0,0,0,.12),
        0 12px 24px rgba(0,0,0,.16),
        0 24px 48px rgba(0,0,0,.10);
      transform: translateY(-2px);
    }

    .card-top {
      flex: 1;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: .25rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.online   { background: #22c55e; }
    .dot.offline  { background: #ef4444; }
    .dot.checking { background: #d1d5db; animation: pulse 1.5s ease-in-out infinite; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .domain {
      font-size: .88rem;
      font-weight: 500;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lbl {
      font-size: .73rem;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 1em;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 0;
      color: #bbb;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>jasonscott.us</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div id="grid"><div class="empty">Loading…</div></div>

  <script>
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function card(h) {
      return `
        <a class="card" href="${esc(h.url)}" target="_blank" rel="noopener noreferrer">
          <div class="card-top"><span class="dot ${h.status}"></span></div>
          <div class="card-body">
            <div class="domain">${esc(h.domain)}</div>
            <div class="lbl">${esc(h.label)}</div>
          </div>
        </a>`
    }

    async function load() {
      try {
        const r  = await fetch('/api/hosts')
        const hs = await r.json()
        document.getElementById('grid').innerHTML =
          hs.length ? hs.map(card).join('') : '<div class="empty">No services configured.</div>'
        const on = hs.filter(h => h.status === 'online').length
        document.getElementById('sub').textContent = `${hs.length} services · ${on} online`
      } catch {
        document.getElementById('sub').textContent = 'Unable to load services.'
      }
    }

    load()
    setInterval(load, 30000)
  </script>
</body>
</html>
