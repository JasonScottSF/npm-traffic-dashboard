<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jasonscott.us</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e2e2e2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 3rem 2rem 4rem;
    }

    header {
      max-width: 960px;
      margin: 0 auto 2.5rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .sub {
      margin-top: .35rem;
      font-size: .8rem;
      color: #555;
    }

    #grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: .75rem;
    }

    a.card {
      display: flex;
      flex-direction: column;
      gap: .4rem;
      background: #161616;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 1rem 1.1rem;
      text-decoration: none;
      color: inherit;
      transition: border-color .15s, background .15s;
    }

    a.card:hover {
      border-color: #3a3a3a;
      background: #1c1c1c;
    }

    .status {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-size: .7rem;
      color: #555;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.online   { background: #3ecf8e; box-shadow: 0 0 4px #3ecf8e66; }
    .dot.offline  { background: #e05252; }
    .dot.checking { background: #444; animation: pulse 1.5s ease-in-out infinite; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .domain {
      font-size: .9rem;
      font-weight: 500;
      color: #e8e8e8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lbl {
      font-size: .75rem;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 1em;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 0;
      color: #333;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>jasonscott.us</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div id="grid"><div class="empty">Loading…</div></div>

  <script>
    let hosts = []

    function dot(s) {
      return `<span class="dot ${s}"></span>`
    }

    function card(h) {
      return `
        <a class="card" href="${esc(h.url)}" target="_blank" rel="noopener noreferrer">
          <div class="status">${dot(h.status)} ${h.status}</div>
          <div class="domain">${esc(h.domain)}</div>
          <div class="lbl">${esc(h.label)}</div>
        </a>`
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    async function load() {
      try {
        const r = await fetch('/api/hosts')
        hosts = await r.json()
        document.getElementById('grid').innerHTML =
          hosts.length ? hosts.map(card).join('') : '<div class="empty">No hosts configured.</div>'
        const on = hosts.filter(h => h.status === 'online').length
        document.getElementById('sub').textContent =
          `${hosts.length} services · ${on} online`
      } catch {
        document.getElementById('sub').textContent = 'Could not load services.'
      }
    }

    load()
    setInterval(load, 30000)
  </script>
</body>
</html>
