/waf_logs/audit/audit.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    size 100M
    dateext
    dateformat -%Y%m%d
}

/waf_logs/audit/dlq.jsonl {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    size 50M
}
